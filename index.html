<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=travel-saas-frontend/pages/index.html" />
  <title>منصة السفر — يُعاد التوجيه</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,sans-serif;
      background:#0f172a;
      color:#f1f5f9;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      text-align:center;
      padding:1.5rem;
    }
    .wrap{max-width:28rem}
    .logo{
      width:3.5rem;height:3.5rem;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      border-radius:1rem;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:1.75rem;
      margin-bottom:1.5rem;
      box-shadow:0 0 0 8px rgba(99,102,241,.15);
    }
    h1{font-size:1.5rem;font-weight:700;margin-bottom:.5rem}
    p{color:#94a3b8;margin-bottom:1.5rem;font-size:.9375rem}
    a{
      display:inline-block;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      color:#fff;
      text-decoration:none;
      padding:.75rem 2rem;
      border-radius:.75rem;
      font-weight:600;
      font-size:.9375rem;
      transition:opacity .2s;
    }
    a:hover{opacity:.85}
    .spinner{
      width:2rem;height:2rem;
      border:3px solid rgba(99,102,241,.2);
      border-top-color:#6366f1;
      border-radius:50%;
      animation:spin .7s linear infinite;
      margin:0 auto 1.25rem;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script>window.location.replace("travel-saas-frontend/pages/index.html");</script>
</head>
<body>
  <div class="wrap">
    <div class="logo">✈</div>
    <div class="spinner"></div>
    <h1>منصة السفر</h1>
    <p>يتم تحميل المنصة...</p>
    <a href="travel-saas-frontend/pages/index.html">انتقل مباشرةً</a>
  </div>
</body>
</html>

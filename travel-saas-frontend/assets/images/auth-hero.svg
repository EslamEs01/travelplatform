<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="ahbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D6E72"/>
      <stop offset="100%" stop-color="#0A4A4D"/>
    </linearGradient>
    <linearGradient id="ahcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="480" height="360" fill="url(#ahbg)"/>
  <!-- Stars -->
  <circle cx="40" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="120" cy="18" r="1" fill="white" opacity="0.5"/>
  <circle cx="200" cy="40" r="1.8" fill="white" opacity="0.7"/>
  <circle cx="320" cy="22" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="420" cy="35" r="1" fill="white" opacity="0.5"/>
  <circle cx="60" cy="60" r="0.8" fill="white" opacity="0.4"/>
  <!-- Globe illustration -->
  <circle cx="240" cy="160" r="90" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="240" cy="160" r="70" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <ellipse cx="240" cy="160" rx="90" ry="35" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="240" cy="160" r="90" fill="rgba(14,129,134,0.25)" stroke="rgba(56,188,192,0.4)" stroke-width="2"/>
  <!-- Land masses simplified -->
  <ellipse cx="210" cy="140" rx="38" ry="28" fill="rgba(56,188,192,0.35)" rx="6"/>
  <ellipse cx="275" cy="170" rx="28" ry="20" fill="rgba(56,188,192,0.3)"/>
  <ellipse cx="225" cy="185" rx="18" ry="12" fill="rgba(56,188,192,0.25)"/>
  <!-- Location pins -->
  <circle cx="220" cy="138" r="5" fill="#FCEBC8"/>
  <circle cx="220" cy="138" r="2.5" fill="#F4BE52"/>
  <circle cx="278" cy="164" r="5" fill="#FCEBC8"/>
  <circle cx="278" cy="164" r="2.5" fill="#F4BE52"/>
  <!-- Connection line -->
  <path d="M220 138 Q249 148 278 164" stroke="#F4BE52" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.8"/>
  <!-- Floating feature cards -->
  <rect x="52" y="120" width="140" height="64" rx="12" fill="url(#ahcard)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="76" cy="148" r="14" fill="rgba(56,188,192,0.4)"/>
  <text x="76" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="white">★</text>
  <rect x="96" y="136" width="80" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="96" y="150" width="60" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="96" y="162" width="70" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <!-- Second card -->
  <rect x="292" y="200" width="136" height="60" rx="12" fill="url(#ahcard)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="314" cy="226" r="12" fill="rgba(244,190,82,0.5)"/>
  <text x="314" y="231" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="white">🔔</text>
  <rect x="332" y="216" width="78" height="7" rx="3.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="332" y="229" width="56" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="332" y="242" width="64" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <!-- Bottom tagline area -->
  <rect x="0" y="290" width="480" height="70" fill="rgba(0,0,0,0.15)"/>
  <text x="240" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" opacity="0.9">رحلاتي — رفيقك في السفر</text>
  <text x="240" y="344" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.6)">واجهة أمامية تجريبية · قابل للربط بنظام حقيقي لاحقاً</text>
</svg>

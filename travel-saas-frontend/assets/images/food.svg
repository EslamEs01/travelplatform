  <path d="M145,148 L145,158 Q148,161 151,158 L151,148" fill="#FCEBC8" opacity="0.5"/>
  <line x1="253" y1="148" x2="253" y2="178" stroke="#FCEBC8" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <rect x="251" y="148" width="4" height="14" rx="1" fill="#FCEBC8" opacity="0.4"/>

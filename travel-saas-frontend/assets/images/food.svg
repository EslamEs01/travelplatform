  <ellipse cx="200" cy="160" rx="55" ry="10" fill="#0E686C" opacity="0.6"/>
  <ellipse cx="200" cy="158" rx="38" ry="7" fill="#16A0A5" opacity="0.5"/>
  <!-- Food on plate -->
  <ellipse cx="200" cy="157" rx="28" ry="5.5" fill="#F4BE52" opacity="0.85"/>
  <circle cx="192" cy="156" r="5" fill="#E08D12" opacity="0.9"/>
  <circle cx="205" cy="155" r="4" fill="#FCEBC8" opacity="0.8"/>
  <circle cx="214" cy="157" r="3.5" fill="#E08D12" opacity="0.85"/>
  <!-- Steam -->
  <path d="M185,148 Q188,138 185,128" stroke="#FCEBC8" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M200,145 Q203,133 200,122" stroke="#FCEBC8" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round"/>
  <path d="M215,148 Q212,138 215,128" stroke="#FCEBC8" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <!-- Side glass / drink -->
  <rect x="275" y="150" width="18" height="28" rx="2" fill="#0E8186" opacity="0.7"/>
  <rect x="277" y="152" width="14" height="8" rx="1" fill="#A4E9EA" opacity="0.5"/>
  <line x1="284" y1="148" x2="284" y2="142" stroke="#F4BE52" stroke-width="1.5" opacity="0.7"/>
  <!-- Side bread/roll -->
  <ellipse cx="120" cy="165" rx="22" ry="12" fill="#E08D12" opacity="0.8"/>
  <ellipse cx="120" cy="163" rx="18" ry="9" fill="#F4BE52" opacity="0.7"/>

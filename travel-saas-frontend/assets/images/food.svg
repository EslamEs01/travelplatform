<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <defs>
    <linearGradient id="fdbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2A1A0A"/><stop offset="100%" stop-color="#3D200E"/></linearGradient>
    <linearGradient id="fdtable" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1A0A04"/><stop offset="100%" stop-color="#2E1208"/></linearGradient>

    <linearGradient id="nmtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#115457"/><stop offset="100%" stop-color="#11464A"/></linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#nsky)"/>
  <!-- Sun rays -->
